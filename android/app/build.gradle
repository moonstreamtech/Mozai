apply plugin: 'com.android.application'

// AdMob ids — mirror of src/env.ts but read at native build time so the
// AndroidManifest `com.google.android.gms.ads.APPLICATION_ID` meta-data
// can be substituted via a manifest placeholder. Real ids come from
// GitHub Secrets (MOZAI_ADMOB_APP_ID); missing values fall back to
// Google's official AdMob test ids so dev builds always have a working
// banner placeholder.
//
// The test publisher prefix `ca-app-pub-3940256099942544` is documented
// at https://developers.google.com/admob/android/test-ads. CI greps the
// release APK for this prefix and fails the build if found, mirroring
// Last Tile's Layer 4 post-build content scan.
def ADMOB_TEST_APP_ID = "ca-app-pub-3940256099942544~3347511713"
def envAdmobAppId = (System.getenv("MOZAI_ADMOB_APP_ID") ?: "").trim()
def resolvedAdmobAppId = envAdmobAppId ?: ADMOB_TEST_APP_ID
def admobMode = envAdmobAppId ? "PRODUCTION" : "TEST"
println("[Mozai] AdMob mode: ${admobMode} (real ids never logged)")

// Release signing.
//
// All values come from GitHub Secrets — nothing is hardcoded and the
// keystore file itself is gitignored. The .github/workflows/release.yml
// workflow decodes MOZAI_KEYSTORE_BASE64 into the path below before
// invoking Gradle.
//
// Local dev fallback: when MOZAI_KEYSTORE_BASE64 (or the materialised
// keystore file) is absent we attach the debug signing config to the
// release variant so `./gradlew assembleRelease` still succeeds on a
// laptop without any secrets configured. This produces a debug-signed
// release APK — installable on dev devices but rejected by Play.
def envKeystorePassword = System.getenv("MOZAI_KEYSTORE_PASSWORD") ?: ""
def envKeyAlias = System.getenv("MOZAI_KEY_ALIAS") ?: ""
def envKeyPassword = System.getenv("MOZAI_KEY_PASSWORD") ?: ""
def releaseKeystoreFile = file("mozai-release.keystore")
def releaseSigningAvailable = releaseKeystoreFile.exists() &&
    envKeystorePassword && envKeyAlias && envKeyPassword
println("[Mozai] Release signing: ${releaseSigningAvailable ? 'PRODUCTION (release keystore)' : 'DEBUG fallback (no MOZAI_KEYSTORE_* env / no keystore file)'}")

android {
    namespace "com.moonstreamtech.mozai"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.moonstreamtech.mozai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // TODO: auto-increment versionCode from the CI run number once
        // we have a release cadence. Hardcoded to 1 for the foundation
        // PR so local + CI builds produce reproducible artifacts.
        versionCode 1
        versionName "0.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The AndroidManifest's `${admobAppId}` placeholder reads this
        // value. Substituting at the Gradle level (not in the manifest
        // directly) keeps the test/real switch in one place and lets CI
        // override per-variant without editing the manifest.
        manifestPlaceholders = [ admobAppId: resolvedAdmobAppId ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // RELEASE upload key. Only registered when the materialised
        // keystore + the three env vars are ALL present — otherwise the
        // release build falls back to debug signing below. Reading the
        // env values inline (rather than caching at evaluation time)
        // means a typo'd env var produces a clearer Gradle error than
        // a silent "tried to sign with empty password" failure.
        if (releaseSigningAvailable) {
            release {
                storeFile releaseKeystoreFile
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Capacitor's WebView shim and several community plugins
            // rely on runtime reflection; minify on without a tuned
            // ProGuard config strips them. Keep minify off here — we
            // can revisit once the colour-by-number engine lands and
            // we have a clear "what reflects what" picture.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Attach the release signing config when available;
            // otherwise the build falls back to the debug signing
            // config so local `./gradlew assembleRelease` still
            // produces an installable (dev-only) artifact. Play would
            // reject a debug-signed AAB, which is the desired guard.
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
